<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080F">
<title>EPO SPORT</title>

<!-- FAVICON: el ícono de la pestaña -->
<link rel="icon" href="https://drive.google.com/thumbnail?id=1qunNHdoD6TSYZoY8Bnk1zvzR7OqsgYPp&sz=w512" type="image/png">
<link rel="apple-touch-icon" href="PEGAR_AQUI_URL_DEL_LOGO">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05080F;color:#F2F5EA;font-family:'Archivo',system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:
 radial-gradient(120% 90% at 85% -10%,#12203A 0%,transparent 55%),
 radial-gradient(110% 80% at -10% 110%,#0E1B12 0%,transparent 55%),
 linear-gradient(180deg,#05080F,#0A1120)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.b1{width:52vmax;height:52vmax;left:-18vmax;top:-20vmax;background:radial-gradient(circle at 35% 35%,rgba(212,255,63,.5),transparent 62%);animation:d1 22s ease-in-out infinite alternate}
.b2{width:46vmax;height:46vmax;right:-16vmax;top:6vmax;background:radial-gradient(circle at 60% 40%,rgba(62,123,255,.46),transparent 62%);animation:d2 28s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.1)}}
@keyframes d2{to{transform:translate(-8vmax,9vmax) scale(.92)}}
.card{position:relative;text-align:center;padding:20px;z-index:2}
.badge{width:88px;height:88px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;
 background:linear-gradient(150deg,#D4FF3F,#93D500);transform:rotate(-4deg);
 box-shadow:0 12px 34px rgba(212,255,63,.35),inset 0 2px 0 rgba(255,255,255,.5);animation:pop .7s cubic-bezier(.2,.7,.2,1.4) both;
 overflow:hidden}
@keyframes pop{from{transform:rotate(-4deg) scale(.6);opacity:0}}
.badge img{width:100%;height:100%;object-fit:cover}
h1{font:400 clamp(30px,9vw,44px)/1 'Archivo Black',sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:-.01em}
h1 em{color:#D4FF3F;text-shadow:0 0 26px rgba(212,255,63,.45)}
p{margin-top:10px;color:#9AA8BC;font:500 13px/1.5 'Archivo',sans-serif;letter-spacing:.06em}
.bar{width:180px;height:4px;margin:22px auto 0;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#D4FF3F,#A8E600);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(460%)}}
a{color:#D4FF3F}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:5;background:#05080F;opacity:0;transition:opacity .4s ease}
#appFrame.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="splash">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="card">
    <!-- LOGO DE LA PANTALLA DE CARGA -->
    <div class="badge">
      <img src="https://drive.google.com/thumbnail?id=1qunNHdoD6TSYZoY8Bnk1zvzR7OqsgYPp&sz=w512" alt="EPO SPORT">
    </div>
    <h1>EPO <em>SPORT</em></h1>
    <p>Abriendo el menú… ⚡</p>
    <div class="bar"><i></i></div>
    <p id="fallback" hidden>¿No avanza? <a id="manual" href="#" target="_blank" rel="noopener">Toca aquí para entrar</a></p>
  </div>
</div>
<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbyCd-spaQaSZZBA90L1-uFJt9nfy5K6-RDNtyiCH_vICW0U-wV2_l8KXwrTj6OHL069H/exec";

(function () {
  var qs = window.location.search || "";
  var target = GAS_URL + qs;
  document.getElementById('manual').href = target;

  var f = document.createElement('iframe');
  f.id = 'appFrame';
  f.title = 'EPO SPORT';
  f.setAttribute('allow', 'geolocation');
  f.src = target;

  var loaded = false;
  f.addEventListener('load', function () {
    loaded = true;
    f.classList.add('on');
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s) s.style.display = 'none';
    }, 450);
  });
  document.body.appendChild(f);

  setTimeout(function () {
    if (!loaded) document.getElementById('fallback').hidden = false;
  }, 9000);
})();
</script>
</body>
</html>
