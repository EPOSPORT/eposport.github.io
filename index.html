<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080F">
<title>EPO SPORT</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05080F;color:#F2F5EA;font-family:'Archivo',system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:
 radial-gradient(120% 90% at 85% -10%,#12203A 0%,transparent 55%),
 radial-gradient(110% 80% at -10% 110%,#0E1B12 0%,transparent 55%),
 linear-gradient(180deg,#05080F,#0A1120)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.b1{width:52vmax;height:52vmax;left:-18vmax;top:-20vmax;background:radial-gradient(circle at 35% 35%,rgba(212,255,63,.5),transparent 62%);animation:d1 22s ease-in-out infinite alternate}
.b2{width:46vmax;height:46vmax;right:-16vmax;top:6vmax;background:radial-gradient(circle at 60% 40%,rgba(62,123,255,.46),transparent 62%);animation:d2 28s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.1)}}
@keyframes d2{to{transform:translate(-8vmax,9vmax) scale(.92)}}
.card{position:relative;text-align:center;padding:24px;z-index:2;max-width:430px}
.badge{width:74px;height:74px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;
 background:linear-gradient(150deg,#D4FF3F,#93D500);transform:rotate(-4deg);
 box-shadow:0 12px 34px rgba(212,255,63,.35),inset 0 2px 0 rgba(255,255,255,.5);animation:pop .7s cubic-bezier(.2,.7,.2,1.4) both}
@keyframes pop{from{transform:rotate(-4deg) scale(.6);opacity:0}}
h1{font:400 clamp(30px,9vw,44px)/1 'Archivo Black',sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:-.01em}
h1 em{color:#D4FF3F;text-shadow:0 0 26px rgba(212,255,63,.45)}
p{margin-top:10px;color:#9AA8BC;font:500 13px/1.6 'Archivo',sans-serif;letter-spacing:.04em}
.bar{width:180px;height:4px;margin:22px auto 0;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#D4FF3F,#A8E600);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(460%)}}
.enter{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:16px 30px;border-radius:16px;border:0;cursor:pointer;
 font:800 16px 'Archivo',sans-serif;letter-spacing:.03em;color:#0A0F1E;text-decoration:none;
 background:linear-gradient(140deg,#D4FF3F,#A8E600);box-shadow:0 14px 34px rgba(212,255,63,.35),inset 0 2px 0 rgba(255,255,255,.5);
 transition:transform .2s,box-shadow .2s;animation:beat 2.2s ease-in-out infinite}
.enter:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(212,255,63,.5)}
.enter:active{transform:scale(.97)}
@keyframes beat{0%,100%{box-shadow:0 14px 34px rgba(212,255,63,.35)}50%{box-shadow:0 14px 44px rgba(212,255,63,.55)}}
.small{font-size:11.5px;margin-top:14px}
a{color:#D4FF3F}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="logo.png">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="card">
    <div class="badge"><svg viewBox="0 0 24 24" width="40" height="40" fill="#0A0F1E"><path d="M13 2 4.5 13.5h5L10 22l8.5-11.5h-5L13 2Z"/></svg></div>
    <h1>EPO <em>SPORT</em></h1>
    <p id="msg">Preparando el menú… ⚡</p>
    <div class="bar" id="loader"><i></i></div>
    <a class="enter" id="enterBtn" href="#" target="_top" hidden>ENTRAR AL MENÚ ⚡</a>
    <p class="small" id="hint" hidden>Ropa casual &amp; deportiva · pedidos por WhatsApp · ubicación y redes</p>
  </div>
</div>

<script>
/* ============================================================
 * EPO SPORT - Puente GitHub Pages
 * CAMBIA SOLO ESTA URL POR TU /exec REAL DE APPS SCRIPT
 * ============================================================ */
var GAS_URL = "https://script.google.com/macros/s/AKfycbyCd-spaQaSZBA90L1-uFJt9nfy5K6-RDNtyiCH_vlCW0U-wV2_I8KXwR1j6OHL069H/exec";

(function () {
  var qs = window.location.search || "";
  var target = GAS_URL + qs;
  document.getElementById('manual').href = target;

  var f = document.createElement('iframe');
  f.id = 'appFrame';
  f.title = 'EPO SPORT';
  f.setAttribute('allow', 'geolocation');
  f.src = target;

  var loaded = false;
  f.addEventListener('load', function () {
    loaded = true;
    f.classList.add('on');
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s) s.style.display = 'none';
    }, 450);
  });
  document.body.appendChild(f);

  /* Respaldo: si en 9 s no carga (conexión lenta), muestra enlace manual */
  setTimeout(function () {
    if (!loaded) document.getElementById('fallback').hidden = false;
  }, 9000);
})();
</script>
</body>
</html>
