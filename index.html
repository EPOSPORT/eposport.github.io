<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080F">
<title>EPO SPORT</title>

<!-- Favicon con tu logo -->
<link rel="icon" href="https://drive.google.com/thumbnail?id=1qunNHdoD6TSYZoY8Bnk1zvzR7OqsgYPp&sz=w512" type="image/png">
<link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1qunNHdoD6TSYZoY8Bnk1zvzR7OqsgYPp&sz=w512">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05080F;color:#F2F5EA;font-family:'Archivo',system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:
 radial-gradient(120% 90% at 85% -10%,#12203A 0%,transparent 55%),
 radial-gradient(110% 80% at -10% 110%,#0E1B12 0%,transparent 55%),
 linear-gradient(180deg,#05080F,#0A1120);z-index:10;transition:opacity .5s ease, visibility .5s}
.stage.hidden{opacity:0;visibility:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.b1{width:52vmax;height:52vmax;left:-18vmax;top:-20vmax;background:radial-gradient(circle at 35% 35%,rgba(212,255,63,.5),transparent 62%);animation:d1 22s ease-in-out infinite alternate}
.b2{width:46vmax;height:46vmax;right:-16vmax;top:6vmax;background:radial-gradient(circle at 60% 40%,rgba(62,123,255,.46),transparent 62%);animation:d2 28s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.1)}}
@keyframes d2{to{transform:translate(-8vmax,9vmax) scale(.92)}}
.card{text-align:center;padding:24px;z-index:2;max-width:400px}
.badge{width:100px;height:100px;margin:0 auto 24px;border-radius:24px;display:grid;place-items:center;
 background:linear-gradient(150deg,#D4FF3F,#93D500);transform:rotate(-4deg);
 box-shadow:0 12px 34px rgba(212,255,63,.35),inset 0 2px 0 rgba(255,255,255,.5);animation:pop .7s cubic-bezier(.2,.7,.2,1.4) both;
 overflow:hidden}
@keyframes pop{from{transform:rotate(-4deg) scale(.6);opacity:0}}
.badge img{width:100%;height:100%;object-fit:cover}
h1{font:400 clamp(32px,10vw,48px)/1 'Archivo Black',sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px}
h1 em{color:#D4FF3F;text-shadow:0 0 26px rgba(212,255,63,.45)}
p{color:#9AA8BC;font:500 14px/1.6 'Archivo',sans-serif;letter-spacing:.02em;margin-bottom:28px}
.btn-enter{display:inline-flex;align-items:center;gap:10px;padding:18px 36px;border-radius:16px;border:0;cursor:pointer;
 font:800 16px 'Archivo',sans-serif;letter-spacing:.04em;color:#0A0F1E;text-decoration:none;
 background:linear-gradient(140deg,#D4FF3F,#A8E600);box-shadow:0 14px 34px rgba(212,255,63,.35),inset 0 2px 0 rgba(255,255,255,.5);
 transition:transform .2s,box-shadow .2s;animation:beat 2.2s ease-in-out infinite}
.btn-enter:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(212,255,63,.5)}
.btn-enter:active{transform:scale(.97)}
@keyframes beat{0%,100%{box-shadow:0 14px 34px rgba(212,255,63,.35)}50%{box-shadow:0 14px 44px rgba(212,255,63,.55)}}
.small{font-size:11.5px;margin-top:20px;color:rgba(255,255,255,.3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- PANTALLA DE CARGA / BIENVENIDA -->
<div class="stage" id="splash">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="card">
    <div class="badge">
      <img src="https://drive.google.com/thumbnail?id=1qunNHdoD6TSYZoY8Bnk1zvzR7OqsgYPp&sz=w512" alt="EPO SPORT">
    </div>
    <h1>EPO <em>SPORT</em></h1>
    <p>Ropa casual &amp; deportiva<br>Pedidos, ubicación y redes</p>
    
    <!-- Este botón abre el menú de forma 100% segura, sin errores de iframe -->
    <a class="btn-enter" id="enterBtn" href="https://script.google.com/macros/s/AKfycbyCd-spaQaSZZBA90L1-uFJt9nfy5K6-RDNtyiCH_vICW0U-wV2_l8KXwrTj6OHL069H/exec" target="_top">
      ABRIR MENÚ ⚡
    </a>
    
    <p class="small">Toca el botón para continuar</p>
  </div>
</div>

<script>
// Opcional: intento de redirección automática después de 1.5 seg.
// Si el navegador lo permite, salta solo. Si no, el botón sigue ahí para que el usuario toque.
setTimeout(function() {
  try {
    window.location.replace("https://script.google.com/macros/s/AKfycbyCd-spaQaSZZBA90L1-uFJt9nfy5K6-RDNtyiCH_vICW0U-wV2_l8KXwrTj6OHL069H/exec");
  } catch (e) {
    // Si falla, no hacemos nada, el botón sigue visible y funcional.
  }
}, 1500);
</script>

</body>
</html>
